# Site isolado do Voryx. Não altera nginx.conf nem os sites do SaaS do X.
# Copiar para /etc/nginx/sites-available/voryx.conf e linkar em sites-enabled/.
# Depois: sudo nginx -t && sudo systemctl reload nginx
# TLS: sudo certbot --nginx -d api.voryx.pro   (o certbot adiciona o bloco 443 aqui mesmo)

server {
    listen 80;
    listen [::]:80;
    server_name api.voryx.pro;

    # uploads de vídeo (VORYX_MAX_UPLOAD_MB=500 + folga)
    client_max_body_size 520m;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # streaming do upload direto para o app, sem bufferizar no disco do nginx
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
