name: voryx

services:
  app:
    build: ./backend
    env_file: .env
    environment:
      VORYX_MEDIA_DIR: /data/media
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - media:/data/media
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  media:
  pgdata:
