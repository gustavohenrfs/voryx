name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voryx
          POSTGRES_PASSWORD: voryx
          POSTGRES_DB: voryx_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voryx -d voryx_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      VORYX_DATABASE_URL: postgresql+asyncpg://voryx:voryx@localhost:5432/voryx_test
      TEST_DATABASE_URL: postgresql+asyncpg://voryx:voryx@localhost:5432/voryx_test
      VORYX_ENCRYPTION_KEY: PuMY6VdGlRupSpoZfX8PnhCG8-YE8ydcyYgM3maE_ls=  # CI only, not a real secret
      VORYX_SECRET_KEY: ci-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check app tests alembic
      - name: Migration applies and matches models
        run: |
          alembic upgrade head
          alembic check
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: https://api.voryx.pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
